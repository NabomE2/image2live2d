name: CI

# Gate every push to main and every pull request on the full test suite. A rig/codec change that
# breaks blink, mouth, head-turn, physics, the IRR, or the .moc3 emitter/codec fails here before merge.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]   # declared floor + a current release
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Editable install + the light optional deps the tests actually use (Pillow / numpy / psd-tools).
      # Heavy ML extras are absent here; tensor tests skip without torch/diffusers.
      # The low-vram-cpu job below runs those contracts with CPU dependencies.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,app]" numpy

      # PYTHONPATH=src is belt-and-suspenders next to the editable install so `import image2live2d`
      # always resolves. Real .moc3 reference models are copyrighted and absent in CI, so
      # test_moc3_roundtrip / the real-sample codec test auto-skip (they never need shipped assets).
      - name: Run tests
        run: PYTHONPATH=src python -m pytest -q

  lint:
    name: lint (ruff, non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true   # advisory only — style never blocks a rig fix from merging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff
      - run: ruff check src tests

  low-vram-cpu:
    name: low_vram CPU tensor contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU inference test dependencies
        run: |
          pip install -e ".[dev,app]"
          pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          pip install diffusers==0.37.0
      - name: Verify low_vram and staged contracts (no CUDA or weights)
        run: python -m pytest -q -ra tests/test_low_vram.py tests/test_low_vram_metrics.py tests/test_seethrough_memory.py
