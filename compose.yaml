services:
  app:
    build: .
    ports:
      - "127.0.0.1:${PORT:-8000}:8000"
    environment:
      IMAGE2LIVE2D_LOCAL_GPU_URL: http://seethrough:8000
      IMAGE2LIVE2D_DECOMPOSE_URL: http://seethrough:8000
      IMAGE2LIVE2D_DECOMPOSE_TIMEOUT: ${SEE_THROUGH_CLIENT_TIMEOUT:-}
      IMAGE2LIVE2D_JOB_DIR: /jobs
      IMAGE2LIVE2D_RETENTION_SECONDS: ${SEE_THROUGH_RETENTION_SECONDS:-604800}
    volumes:
      - app-jobs:/jobs
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  seethrough:
    profiles: [gpu]
    build: service/seethrough
    volumes:
      - models:/models
      - inference-jobs:/jobs
    environment:
      MODEL_DIR: /models
      HF_HOME: /models/cache
      MANAGED_MODELS: "1"
      SEE_THROUGH_JOB_DIR: /jobs
      SEE_THROUGH_RETENTION_SECONDS: ${SEE_THROUGH_RETENTION_SECONDS:-604800}
      SEE_THROUGH_LAYERDIFF_TIMEOUT: ${SEE_THROUGH_LAYERDIFF_TIMEOUT:-1800}
      SEE_THROUGH_DEPTH_TIMEOUT: ${SEE_THROUGH_DEPTH_TIMEOUT:-1800}
      SEE_THROUGH_PSD_TIMEOUT: ${SEE_THROUGH_PSD_TIMEOUT:-900}
      SEE_THROUGH_TIMEOUT: ${SEE_THROUGH_TIMEOUT:-900}
      SEE_THROUGH_MEMORY_PROFILE: ${SEE_THROUGH_MEMORY_PROFILE:-staged}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
volumes:
  models:
  inference-jobs:
  app-jobs:
